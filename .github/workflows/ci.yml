name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ui:
    name: typecheck, tests, schema, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # test:unit runs the .ts tests with --experimental-strip-types (22.6+).
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run check:card-schema
      # The bundle at cairn_ui/_dist is committed (installing never needs
      # Node), so it IS the wheel's payload: a commit whose sources changed
      # without a rebuild would ship a stale viewer. Checked against a
      # fingerprint of the inputs, before this job's own build rewrites it:
      # builds are not byte-identical across platforms (Linux and macOS
      # minify differently), the inputs are.
      - name: committed bundle matches the sources
        run: node scripts/source-hash.mjs check
      - run: npm run build

[project]
name = "cairn-ui"
# MUST equal cairn-track's version. The bundle encodes the /api/* response
# shapes and the card-spec schema that server produces, so skew is a bug rather
# than a compatibility window. Pinned by a test in the root project.
version = "0.2.0"
description = "The Cairn browser viewer: the built bundle, plus the Python surface that drives it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Cairn contributors" }]
keywords = ["cairn", "experiment-tracking", "viewer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
# The card surface needs the tracker's DataRef and config to resolve run[tag]
# handles and find a server, and the renderer's Element and spec models to build
# a card. cairn-track[ui] depending back on this package is the ordinary plugin
# shape — that extra points here, this points at base cairn-track.
dependencies = [
    "cairn-track",
    "cairn-plot>=0.1,<0.2",
]

[project.urls]
Repository = "https://github.com/DoeringChristian/cairn-ui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# cairn-plot is vendored as a submodule (same pinned commit the UI builds
# against); cairn-track resolves from the index. For local co-development point
# uv at a sibling checkout instead:
#   [tool.uv.sources]
#   cairn-track = { path = "../cairn", editable = true }
[tool.uv.sources]
cairn-plot = { path = "vendor/cairn-plot", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["cairn_ui"]
# `_dist/` is bundler output that is nevertheless committed, so installing never
# needs Node. Explicit `artifacts` so hatchling ships it regardless of how it
# reads build-output heuristics.
artifacts = ["cairn_ui/_dist/**/*"]

[tool.hatch.build.targets.sdist]
# Ship the TypeScript sources too, so the sdist is rebuildable from scratch.
include = [
    "cairn_ui/",
    "src/",
    "scripts/",
    "*.html",
    "*.json",
    "*.ts",
    "*.js",
    "README.md",
    "pyproject.toml",
]
exclude = ["node_modules", "*.tsbuildinfo"]

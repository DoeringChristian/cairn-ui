[project]
name = "cairn-ui"
# MUST equal cairn-track's version. The bundle encodes the /api/* response
# shapes and the card-spec schema that server produces, so skew is a bug rather
# than a compatibility window. Pinned by a test in the root project.
version = "0.2.0"
description = "The Cairn browser viewer: the built bundle, plus the Python surface that drives it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Cairn contributors" }]
keywords = ["cairn", "experiment-tracking", "viewer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
# The card surface needs the tracker's DataRef and config to resolve run[tag]
# handles and find a server, and the renderer's Element and spec models to build
# a card. cairn-track[ui] depending back on this package is the ordinary plugin
# shape — that extra points here, this points at base cairn-track.
dependencies = [
    # No URL for cairn-track: this package is pulled by `cairn-track[ui]`, so
    # the install that asks for it already supplies it. Pinning it here would
    # make the cycle two pinned URLs deep and buy nothing.
    "cairn-track",
    # cairn-plot is not on any index yet, so a bare version range cannot
    # resolve — pip would 404. Pinned to the commit vendor/cairn-plot records.
    # Swap back to "cairn-plot>=0.1,<0.2" the day it is published.
    "cairn-plot @ git+https://github.com/doeringchristian/cairn-plot@fadd844f890c674966d9f0af8d4e46bf96e42725",
]

[project.urls]
Repository = "https://github.com/DoeringChristian/cairn-ui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Required for the `cairn-plot @ git+...` pin above. Hatchling refuses direct
# references by default because PyPI rejects any distribution carrying one;
# that is the correct guard, and this package is installed from git, not PyPI.
[tool.hatch.metadata]
allow-direct-references = true

# Deliberately NO [tool.uv.sources]. cairn-plot is vendored as a submodule for
# the TypeScript build (vite compiles its source in), but declaring a path
# source here would follow this package into every consumer — and the cairn
# monorepo supplies its own cairn-plot, so two path sources for one package is
# a hard resolution conflict.
#
# For Python work in this repo before cairn-plot is published, add locally:
#   [tool.uv.sources]
#   cairn-plot = { path = "vendor/cairn-plot", editable = true }
#   cairn-track = { path = "../cairn", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["cairn_ui"]
# `_dist/` is bundler output that is nevertheless committed, so installing never
# needs Node. Explicit `artifacts` so hatchling ships it regardless of how it
# reads build-output heuristics.
artifacts = ["cairn_ui/_dist/**/*"]

[tool.hatch.build.targets.sdist]
# Ship the TypeScript sources too, so the sdist is rebuildable from scratch.
include = [
    "cairn_ui/",
    "src/",
    "scripts/",
    "*.html",
    "*.json",
    "*.ts",
    "*.js",
    "README.md",
    "pyproject.toml",
]
exclude = ["node_modules", "*.tsbuildinfo"]
